# Stack produksi untuk VPS: Postgres + game (image dari GHCR) + Caddy (HTTPS otomatis).
# Butuh file .env berisi APP_IMAGE, POSTGRES_PASSWORD, dan DOMAIN (lihat .env.production.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: windi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: windi
    volumes:
      - windi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windi -d windi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Image hasil GitHub Actions, mis. ghcr.io/namakamu/windi-sweet-bakery:latest
    image: ${APP_IMAGE:?isi APP_IMAGE di .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://windi:${POSTGRES_PASSWORD}@db:5432/windi
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  windi_db:
  caddy_data:
  caddy_config:
